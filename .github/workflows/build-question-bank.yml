name: Build private FFB question bank

on:
  push:
    branches:
      - build/private-question-bank-20261121

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate the private question bank
        run: node scripts/ensure-question-bank.js
      - name: Upload generated JSON
        uses: actions/upload-artifact@v4
        with:
          name: ffb-question-bank-private
          path: .local/question-bank.json
          if-no-files-found: error
          retention-days: 1
