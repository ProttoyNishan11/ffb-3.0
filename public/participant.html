<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24105b">
  <title>Participants · Family Feud Bangladesh</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar participant-topbar"><a href="/" class="brand-link">🇧🇩 <span>Family Feud Bangladesh</span></a><div class="connection-pill" id="connectionStatus"><span class="status-dot"></span> Connecting…</div></header>
  <main class="participant-shell">
    <section class="join-cloud-panel" id="participantJoinPanel" hidden><div class="auth-card"><div class="modal-icon">🎟️</div><p class="eyebrow">ONLINE GAME</p><h1>Join a Game</h1><label for="participantJoinInput">Room code</label><input id="participantJoinInput" placeholder="Enter room code" autocomplete="off"><p class="form-error" id="participantJoinError" role="alert"></p><button class="primary-button full-width" id="participantJoinButton" type="button">Join Game</button></div></section>
    <section class="waiting-panel" id="waitingPanel"><div class="waiting-animation">🎤</div><p class="eyebrow">PARTICIPANT SCREEN</p><h1>Host-এর অপেক্ষায় থাকুন</h1><p>Host প্রশ্ন প্রকাশ করলে সেটি এখানে দেখা যাবে।</p><div class="waiting-indicator"><span></span><span></span><span></span></div></section>
    <section class="live-board" id="liveBoard" hidden><div class="live-label"><span class="live-dot"></span> LIVE QUESTION <span id="setLabel"></span></div><p class="question-number" id="questionNumber"></p><h1 id="liveQuestion"></h1><div class="answer-board" id="answerBoard" aria-live="polite"></div><p class="board-hint" id="boardHint">উত্তর প্রকাশের জন্য Host-এর অপেক্ষা করুন</p></section>
  </main>
  <footer class="participant-footer">গেমটি Host / Admin দ্বারা পরিচালিত</footer>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/participant.js"></script>
</body>
</html>
